<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070714" />
      <stop offset="50%" stop-color="#100C22" />
      <stop offset="100%" stop-color="#1A0D2E" />
    </linearGradient>

    <linearGradient id="purpleGradAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="aiCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17122C" />
      <stop offset="100%" stop-color="#110D20" />
    </linearGradient>

    <filter id="aiGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGradAI)" />

  <!-- Ambient Glows -->
  <circle cx="1000" cy="180" r="280" fill="#8B5CF6" opacity="0.1" />
  <circle cx="300" cy="550" r="240" fill="#EC4899" opacity="0.08" />

  <!-- Browser Frame -->
  <g transform="translate(40, 30)">
    <rect width="1120" height="615" rx="16" fill="#110D20" stroke="#2F214A" stroke-width="1.5" filter="url(#aiGlow)" />

    <!-- Title bar -->
    <rect width="1120" height="46" rx="16" fill="#0C0817" />
    <path d="M0 46 L1120 46" stroke="#22173B" stroke-width="1" />

    <circle cx="24" cy="23" r="6" fill="#EF4444" opacity="0.8" />
    <circle cx="44" cy="23" r="6" fill="#F59E0B" opacity="0.8" />
    <circle cx="64" cy="23" r="6" fill="#10B981" opacity="0.8" />

    <!-- URL Bar -->
    <rect x="350" y="10" width="420" height="26" rx="8" fill="#18112D" stroke="#2D1E4E" stroke-width="1" />
    <text x="375" y="27" fill="#C084FC" font-family="monospace" font-size="11">✨ https://ai.laravel.dev/workspace/gemini-pro</text>

    <!-- Model Status Badge -->
    <rect x="940" y="10" width="155" height="26" rx="8" fill="url(#geminiGrad)" />
    <text x="1017" y="27" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">⚡ Gemini 1.5 Pro Live</text>

    <!-- ── LEFT SIDEBAR: CONVERSATIONS & PROMPT LIBRARY ────── -->
    <g transform="translate(0, 46)">
      <rect width="230" height="569" fill="#0E0A1B" />
      <path d="M230 0 L230 569" stroke="#22173B" stroke-width="1" />

      <!-- App Logo -->
      <g transform="translate(20, 20)">
        <rect width="36" height="36" rx="10" fill="url(#purpleGradAI)" />
        <text x="18" y="24" fill="#FFFFFF" font-size="18" font-weight="900" text-anchor="middle">✨</text>
        <text x="48" y="22" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="15" font-weight="800">Laravel AI</text>
        <text x="48" y="34" fill="#C084FC" font-family="sans-serif" font-size="9" font-weight="600">ASSISTANT ENGINE</text>
      </g>

      <!-- New Chat Button -->
      <g transform="translate(18, 75)">
        <rect width="194" height="38" rx="10" fill="url(#purpleGradAI)" />
        <text x="97" y="24" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">+ New AI Prompt</text>
      </g>

      <!-- History List -->
      <g transform="translate(18, 130)">
        <text x="6" y="16" fill="#6B7280" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="1">RECENT SESSIONS</text>

        <!-- Active Session -->
        <g transform="translate(0, 28)">
          <rect width="194" height="38" rx="10" fill="#1C1433" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.4" />
          <text x="14" y="23" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600">Laravel Multi-tenant RBAC...</text>
        </g>

        <!-- Session 2 -->
        <g transform="translate(0, 72)">
          <text x="14" y="23" fill="#9CA3AF" font-family="sans-serif" font-size="11">Optimize Eloquent Query...</text>
        </g>

        <!-- Session 3 -->
        <g transform="translate(0, 110)">
          <text x="14" y="23" fill="#9CA3AF" font-family="sans-serif" font-size="11">JWT Token Refresh Middleware</text>
        </g>

        <!-- Session 4 -->
        <g transform="translate(0, 148)">
          <text x="14" y="23" fill="#9CA3AF" font-family="sans-serif" font-size="11">Gemini API Stream Handler</text>
        </g>
      </g>

      <!-- Model Token Consumption Box -->
      <g transform="translate(18, 480)">
        <rect width="194" height="70" rx="12" fill="#150F28" stroke="#291A44" stroke-width="1" />
        <text x="14" y="22" fill="#C084FC" font-family="sans-serif" font-size="10" font-weight="700">TOKEN CONSUMPTION</text>
        <text x="14" y="44" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="800">42,850 <tspan font-size="10" fill="#9CA3AF">/ 1M TPM</tspan></text>
        <rect x="14" y="52" width="166" height="6" rx="3" fill="#25173F" />
        <rect x="14" y="52" width="65" height="6" rx="3" fill="url(#geminiGrad)" />
      </g>
    </g>

    <!-- ── MAIN AI INTERACTION WORKSPACE ─────────────────────── -->
    <g transform="translate(250, 60)">
      
      <!-- User Query Bubble -->
      <g transform="translate(0, 0)">
        <circle cx="20" cy="20" r="14" fill="#3B2A5A" />
        <text x="20" y="24" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">PM</text>
        <rect x="45" y="4" width="790" height="48" rx="12" fill="#1C1433" stroke="#312255" stroke-width="1" />
        <text x="65" y="32" fill="#E9D5FF" font-family="sans-serif" font-size="12" font-weight="500">Generate a secure Laravel controller method for validating user credentials with rate-limiting &amp; audit logging.</text>
      </g>

      <!-- AI Streaming Response Box -->
      <g transform="translate(0, 70)">
        <rect width="835" height="425" rx="14" fill="url(#aiCardBg)" stroke="#2F214A" stroke-width="1" />
        
        <!-- Header of Response -->
        <g transform="translate(20, 16)">
          <circle cx="12" cy="12" r="12" fill="url(#geminiGrad)" />
          <text x="12" y="16" fill="#FFFFFF" font-size="12" text-anchor="middle">✨</text>
          <text x="34" y="16" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Gemini 1.5 Pro Assistant</text>
          <rect x="200" y="3" width="70" height="18" rx="5" fill="#052E16" />
          <text x="235" y="15" fill="#4ADE80" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">384 ms latency</text>
        </g>

        <!-- Markdown / Code Block -->
        <g transform="translate(20, 50)">
          <rect width="795" height="300" rx="10" fill="#0A0614" stroke="#221638" stroke-width="1" />
          
          <!-- Code File Tab -->
          <rect width="795" height="32" rx="10" fill="#140E24" />
          <text x="16" y="20" fill="#A78BFA" font-family="monospace" font-size="11">app/Http/Controllers/Api/AuthController.php</text>
          <text x="740" y="20" fill="#9CA3AF" font-family="sans-serif" font-size="10">PHP 8.3 / Laravel 11</text>

          <!-- Code Snippets -->
          <g transform="translate(16, 52)">
            <text x="0" y="0" fill="#F43F5E" font-family="monospace" font-size="12">public function</text>
            <text x="120" y="0" fill="#38BDF8" font-family="monospace" font-size="12">login(LoginRequest $request): JsonResponse</text>
            <text x="0" y="20" fill="#9CA3AF" font-family="monospace" font-size="12">{</text>
            
            <text x="20" y="42" fill="#6B7280" font-family="monospace" font-size="11">// Apply IP-based rate limiting prevention</text>
            <text x="20" y="62" fill="#F472B6" font-family="monospace" font-size="12">RateLimiter::ensureIsNotRateLimited</text>
            <text x="290" y="62" fill="#E2E8F0" font-family="monospace" font-size="12">($request-&gt;throttleKey());</text>

            <text x="20" y="90" fill="#F43F5E" font-family="monospace" font-size="12">if</text>
            <text x="40" y="90" fill="#E2E8F0" font-family="monospace" font-size="12">(! Auth::attempt($request-&gt;validated())) {</text>
            <text x="40" y="112" fill="#F472B6" font-family="monospace" font-size="12">    SecurityAuditLog::recordFailure</text>
            <text x="315" y="112" fill="#E2E8F0" font-family="monospace" font-size="12">($request-&gt;email, $request-&gt;ip());</text>
            <text x="40" y="134" fill="#F43F5E" font-family="monospace" font-size="12">    throw</text>
            <text x="85" y="134" fill="#FBBF24" font-family="monospace" font-size="12">ValidationException::withMessages(['email' =&gt; 'Unauthorized']);</text>
            <text x="20" y="156" fill="#9CA3AF" font-family="monospace" font-size="12">}</text>

            <text x="20" y="184" fill="#34D399" font-family="monospace" font-size="12">$token = $user-&gt;createToken('auth-token', ['read', 'write'])-&gt;plainTextToken;</text>
            <text x="20" y="206" fill="#F43F5E" font-family="monospace" font-size="12">return</text>
            <text x="75" y="206" fill="#38BDF8" font-family="monospace" font-size="12">response()-&gt;json(['status' =&gt; 'success', 'token' =&gt; $token]);</text>
            <text x="0" y="226" fill="#9CA3AF" font-family="monospace" font-size="12">}</text>
          </g>
        </g>

        <!-- Prompt Suggestions / Action Buttons -->
        <g transform="translate(20, 365)">
          <rect width="180" height="34" rx="8" fill="#1E1438" stroke="#3D2968" stroke-width="1" />
          <text x="90" y="22" fill="#C084FC" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">🧪 Generate Unit Tests</text>

          <rect x="195" y="0" width="180" height="34" rx="8" fill="#1E1438" stroke="#3D2968" stroke-width="1" />
          <text x="285" y="22" fill="#C084FC" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">🛡 Add 2FA Middleware</text>

          <rect x="390" y="0" width="180" height="34" rx="8" fill="#1E1438" stroke="#3D2968" stroke-width="1" />
          <text x="480" y="22" fill="#C084FC" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">📋 Copy PHP Code</text>
        </g>
      </g>

      <!-- Bottom Chat Input Bar -->
      <g transform="translate(0, 505)">
        <rect width="835" height="48" rx="12" fill="#140E24" stroke="#312255" stroke-width="1" />
        <text x="20" y="29" fill="#9CA3AF" font-family="sans-serif" font-size="12">Ask Laravel AI anything (e.g. Write Dockerfile for PHP 8.3 &amp; Redis)...</text>
        <rect x="765" y="8" width="56" height="32" rx="8" fill="url(#geminiGrad)" />
        <text x="793" y="28" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">→</text>
      </g>

    </g>
  </g>
</svg>
