          <text x="541" y="56" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">📋 Copy Link</text>
        </g>

        <!-- Bottom Security Verification Bar -->
        <g transform="translate(20, 380)">
