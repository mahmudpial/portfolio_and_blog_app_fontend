    <!-- ── VAULT MAIN CONTENT (2 COLUMNS) ─────────────────────── -->
    <g transform="translate(40, 130)">

      <!-- LEFT: Live Encrypted Payload Editor -->
      <g transform="translate(0, 0)">
        <rect width="660" height="440" rx="14" fill="url(#vaultCardBg)" stroke="#222B48" stroke-width="1" />
        
        <!-- Editor Header -->
        <rect width="660" height="42" rx="14" fill="#12162B" />
        <path d="M0 42 L660 42" stroke="#222B48" stroke-width="1" />
        <text x="20" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">🔒 Secret Payload (.env / config)</text>
        <rect x="530" y="10" width="110" height="22" rx="6" fill="#042F2E" stroke="#0D9488" stroke-width="1" />
        <text x="585" y="25" fill="#2DD4BF" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">CLIENT ENCRYPTED</text>

        <!-- Secret Key-Value Code Editor Area -->
        <g transform="translate(20, 60)">
          <!-- Line 1 -->
          <text x="0" y="20" fill="#64748B" font-family="monospace" font-size="12">01</text>
          <text x="35" y="20" fill="#38BDF8" font-family="monospace" font-size="12">APP_ENV</text>
          <text x="105" y="20" fill="#94A3B8" font-family="monospace" font-size="12">=</text>
          <text x="120" y="20" fill="#A7F3D0" font-family="monospace" font-size="12">production</text>

          <!-- Line 2 -->
          <text x="0" y="50" fill="#64748B" font-family="monospace" font-size="12">02</text>
          <text x="35" y="50" fill="#38BDF8" font-family="monospace" font-size="12">APP_KEY</text>
          <text x="105" y="50" fill="#94A3B8" font-family="monospace" font-size="12">=</text>
          <rect x="120" y="36" width="340" height="20" rx="4" fill="#090D1A" stroke="#1E293B" stroke-width="1" />
          <text x="130" y="50" fill="#F43F5E" font-family="monospace" font-size="12">base64:7v8Z••••••••••••••••••••••••••••</text>
          <text x="475" y="50" fill="#94A3B8" font-family="sans-serif" font-size="10">[MASKED]</text>

          <!-- Line 3 -->
          <text x="0" y="80" fill="#64748B" font-family="monospace" font-size="12">03</text>
          <text x="35" y="80" fill="#38BDF8" font-family="monospace" font-size="12">DB_PASSWORD</text>
          <text x="140" y="80" fill="#94A3B8" font-family="monospace" font-size="12">=</text>
          <rect x="155" y="66" width="305" height="20" rx="4" fill="#090D1A" stroke="#1E293B" stroke-width="1" />
          <text x="165" y="80" fill="#F43F5E" font-family="monospace" font-size="12">••••••••••••••••••••••••</text>

          <!-- Line 4 -->
          <text x="0" y="110" fill="#64748B" font-family="monospace" font-size="12">04</text>
          <text x="35" y="110" fill="#38BDF8" font-family="monospace" font-size="12">STRIPE_SECRET</text>
          <text x="150" y="110" fill="#94A3B8" font-family="monospace" font-size="12">=</text>
          <rect x="165" y="96" width="295" height="20" rx="4" fill="#090D1A" stroke="#1E293B" stroke-width="1" />
          <text x="175" y="110" fill="#F43F5E" font-family="monospace" font-size="12">sk_live_51N••••••••••••••••</text>

          <!-- Line 5 -->
          <text x="0" y="140" fill="#64748B" font-family="monospace" font-size="12">05</text>
          <text x="35" y="140" fill="#38BDF8" font-family="monospace" font-size="12">REDIS_HOST</text>
          <text x="130" y="140" fill="#94A3B8" font-family="monospace" font-size="12">=</text>
          <text x="145" y="140" fill="#A7F3D0" font-family="monospace" font-size="12">127.0.0.1</text>

          <!-- Line 6 -->
          <text x="0" y="170" fill="#64748B" font-family="monospace" font-size="12">06</text>
          <text x="35" y="170" fill="#38BDF8" font-family="monospace" font-size="12">AWS_SECRET_KEY</text>
          <text x="165" y="170" fill="#94A3B8" font-family="monospace" font-size="12">=</text>
          <rect x="180" y="156" width="280" height="20" rx="4" fill="#090D1A" stroke="#1E293B" stroke-width="1" />
          <text x="190" y="170" fill="#F43F5E" font-family="monospace" font-size="12">wJalrXUtn••••••••••••••••</text>
        </g>

        <!-- Shareable Link & Encryption Passphrase Box -->
        <g transform="translate(20, 275)">
          <rect width="620" height="85" rx="10" fill="#0A0E1D" stroke="#1E2845" stroke-width="1" />
          <text x="16" y="24" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">ONE-TIME GENERATED SECURE LINK:</text>
          
