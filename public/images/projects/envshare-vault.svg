          <rect width="360" height="135" rx="14" fill="url(#vaultCardBg)" stroke="#222B48" stroke-width="1" />
          <text x="18" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">🔑 Extra Passphrase Protection</text>
          
          <g transform="translate(18, 42)">
            <rect width="324" height="36" rx="8" fill="#0A0F20" stroke="#0284C7" stroke-width="1" />
            <text x="14" y="22" fill="#38BDF8" font-family="monospace" font-size="11">Argon2id Hash Enabled</text>
            <rect x="250" y="8" width="60" height="20" rx="5" fill="#0284C7" />
            <text x="280" y="22" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">ACTIVE</text>
          </g>

          <text x="18" y="105" fill="#94A3B8" font-family="sans-serif" font-size="10" line-height="1.4">Requires password input prior to decrypting ciphertext in client browser.</text>
        </g>

        <!-- Access & Audit Logs Summary -->
