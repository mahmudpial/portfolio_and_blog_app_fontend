<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0E1222" />
      <stop offset="100%" stop-color="#141128" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="vaultCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B30" />
      <stop offset="100%" stop-color="#101426" />
    </linearGradient>

    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadowVault" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="675" fill="url(#bgGrad2)" />

  <!-- Background Cyber Matrix Elements -->
  <circle cx="200" cy="180" r="260" fill="#06B6D4" opacity="0.06" />
  <circle cx="1020" cy="500" r="260" fill="#8B5CF6" opacity="0.07" />

  <!-- Main Application Window -->
  <g transform="translate(40, 30)">
    <rect width="1120" height="615" rx="16" fill="#0E1222" stroke="#222B45" stroke-width="1.5" filter="url(#shadowVault)" />

    <!-- Top Window Chrome -->
    <rect width="1120" height="46" rx="16" fill="#090D1A" />
    <path d="M0 46 L1120 46" stroke="#1D243A" stroke-width="1" />

    <!-- Traffic Lights -->
    <circle cx="24" cy="23" r="6" fill="#EF4444" opacity="0.8" />
    <circle cx="44" cy="23" r="6" fill="#F59E0B" opacity="0.8" />
    <circle cx="64" cy="23" r="6" fill="#10B981" opacity="0.8" />

    <!-- URL Bar with Lock -->
    <rect x="340" y="10" width="440" height="26" rx="8" fill="#141A2E" stroke="#263152" stroke-width="1" />
    <circle cx="360" cy="23" r="3" fill="#06B6D4" />
    <text x="375" y="27" fill="#67E8F9" font-family="monospace" font-size="11" font-weight="600">🔒 https://envshare.vault.dev/share/e2ee-9b4f7a2</text>

    <!-- Security Protocol Tag -->
    <rect x="940" y="10" width="155" height="26" rx="8" fill="#082F49" stroke="#0284C7" stroke-width="1" />
    <text x="1017" y="27" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">🛡 AES-256-GCM ZERO-KNOWLEDGE</text>

    <!-- ── APP HEADER & NAV ──────────────────────────────────── -->
    <g transform="translate(40, 65)">
      <g transform="translate(0, 0)">
        <rect width="40" height="40" rx="10" fill="url(#cyanGrad)" />
        <path d="M20 10 L28 14 L28 22 C28 27 20 31 20 31 C20 31 12 27 12 22 L12 14 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
        <text x="52" y="24" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">envShare <tspan fill="#38BDF8">Vault</tspan></text>
        <text x="52" y="38" fill="#94A3B8" font-family="sans-serif" font-size="11">End-to-End Encrypted Secret &amp; Environment Config Sharing</text>
      </g>

