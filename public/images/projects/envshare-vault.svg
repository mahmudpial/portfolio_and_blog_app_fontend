          <text x="350" y="20" fill="#A855F7" font-family="sans-serif" font-size="11" font-weight="600">⚡ Client-Side WebCrypto API</text>
        </g>
      </g>

      <!-- RIGHT: Security & Self-Destruct Rules -->
      <g transform="translate(680, 0)">
        
        <!-- Rule 1: Self Destruct Setting -->
