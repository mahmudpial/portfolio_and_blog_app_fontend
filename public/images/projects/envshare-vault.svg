          <rect width="360" height="140" rx="14" fill="url(#vaultCardBg)" stroke="#222B48" stroke-width="1" />
          <text x="18" y="24" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">📜 Audit Activity Log</text>

          <g transform="translate(18, 40)">
            <circle cx="6" cy="6" r="3" fill="#10B981" />
            <text x="18" y="10" fill="#E2E8F0" font-family="sans-serif" font-size="10" font-weight="600">Vault Created by Admin (Pial)</text>
            <text x="18" y="24" fill="#64748B" font-family="sans-serif" font-size="9">Today 04:12:08 UTC • SHA-256 Validated</text>
          </g>

          <g transform="translate(18, 78)">
            <circle cx="6" cy="6" r="3" fill="#06B6D4" />
            <text x="18" y="10" fill="#E2E8F0" font-family="sans-serif" font-size="10" font-weight="600">Encrypted in Memory (128-bit Entropy)</text>
            <text x="18" y="24" fill="#64748B" font-family="sans-serif" font-size="9">Client: Firefox 128 (Mac OS)</text>
          </g>
        </g>
