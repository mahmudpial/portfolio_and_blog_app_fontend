          <text x="14" y="24" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">Farhan Ahmed</text>
          <text x="14" y="40" fill="#94A3B8" font-family="sans-serif" font-size="10">3y Exp • Vue 3, Inertia, Tailwind</text>
          <rect x="14" y="55" width="55" height="18" rx="4" fill="#064E3B" />
          <text x="41" y="68" fill="#6EE7B7" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">Vue.js</text>
          <text x="14" y="95" fill="#64748B" font-family="sans-serif" font-size="9">Applied 5h ago</text>
