      <g transform="translate(810, 0)">
        <rect width="250" height="415" rx="12" fill="url(#kanbanColBg)" stroke="#233052" stroke-width="1" />
        <rect width="250" height="38" rx="12" fill="#182342" />
        <circle cx="20" cy="19" r="4" fill="#10B981" />
        <text x="32" y="23" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="700">Offer Sent (3)</text>

        <!-- Card 1 -->
        <g transform="translate(12, 50)">
          <rect width="226" height="115" rx="10" fill="#1E294B" stroke="#059669" stroke-width="1.5" />
          <text x="14" y="24" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">Sabbir Hossain</text>
          <text x="14" y="40" fill="#6EE7B7" font-family="sans-serif" font-size="10" font-weight="600">Senior Backend Engineer</text>
          <rect x="14" y="55" width="90" height="20" rx="5" fill="#064E3B" />
          <text x="59" y="69" fill="#34D399" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">Offer Letter Sent</text>
          <text x="14" y="100" fill="#94A3B8" font-family="sans-serif" font-size="9">Awaiting Sign-off (2d left)</text>
