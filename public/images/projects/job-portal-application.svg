          <text x="14" y="24" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">Tasneem Jahan</text>
          <text x="14" y="40" fill="#C084FC" font-family="sans-serif" font-size="10" font-weight="600">Technical Round 2 (System Design)</text>
          <rect x="14" y="55" width="110" height="20" rx="5" fill="#581C87" />
          <text x="69" y="69" fill="#E9D5FF" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">Today @ 4:30 PM</text>
