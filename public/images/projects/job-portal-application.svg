          <text x="14" y="100" fill="#10B981" font-family="sans-serif" font-size="9" font-weight="700">Passed Code Review</text>
        </g>
      </g>

      <!-- Column 3: Live Interview (6) -->
      <g transform="translate(540, 0)">
        <rect width="250" height="415" rx="12" fill="url(#kanbanColBg)" stroke="#233052" stroke-width="1" />
        <rect width="250" height="38" rx="12" fill="#182342" />
        <circle cx="20" cy="19" r="4" fill="#8B5CF6" />
