      <g transform="translate(270, 0)">
        <rect width="250" height="415" rx="12" fill="url(#kanbanColBg)" stroke="#233052" stroke-width="1" />
        <rect width="250" height="38" rx="12" fill="#182342" />
        <circle cx="20" cy="19" r="4" fill="#F59E0B" />
        <text x="32" y="23" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="700">Code Assessment (12)</text>

        <!-- Card 1 -->
        <g transform="translate(12, 50)">
          <rect width="226" height="115" rx="10" fill="#1E294B" stroke="#314373" stroke-width="1" />
          <text x="14" y="24" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">Rakib Hossain</text>
