<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="jobBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="kanbanColBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151D36" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <filter id="jobShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#jobBg)" />

  <g transform="translate(40, 30)">
    <rect width="1120" height="615" rx="16" fill="#0F172A" stroke="#2A385C" stroke-width="1.5" filter="url(#jobShadow)" />

    <!-- Window Bar -->
    <rect width="1120" height="46" rx="16" fill="#0A0F1D" />
    <path d="M0 46 L1120 46" stroke="#1E293B" stroke-width="1" />

    <circle cx="24" cy="23" r="6" fill="#EF4444" opacity="0.8" />
    <circle cx="44" cy="23" r="6" fill="#F59E0B" opacity="0.8" />
    <circle cx="64" cy="23" r="6" fill="#10B981" opacity="0.8" />

    <rect x="350" y="10" width="420" height="26" rx="8" fill="#131C33" stroke="#25355E" stroke-width="1" />
    <text x="375" y="27" fill="#93C5FD" font-family="monospace" font-size="11">💼 https://careerhub.pro/ats/candidates-pipeline</text>

    <!-- App Header -->
    <g transform="translate(30, 65)">
      <rect width="36" height="36" rx="10" fill="url(#blueGrad)" />
      <path d="M12 14 L24 14 L24 24 L12 24 Z" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <path d="M15 14 L15 11 C15 10 16 9 17 9 L19 9 C20 9 21 10 21 11 L21 14" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <text x="48" y="22" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="800">CareerHub <tspan fill="#60A5FA">ATS</tspan></text>
      <text x="48" y="34" fill="#94A3B8" font-family="sans-serif" font-size="10">RECRUITMENT &amp; APPLICANT TRACKING SYSTEM</text>

      <rect x="890" y="4" width="170" height="32" rx="8" fill="url(#blueGrad)" />
      <text x="975" y="25" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">+ Post Senior Job</text>
    </g>

    <!-- Job Role Title & Filter Tabs -->
    <g transform="translate(30, 120)">
      <text x="0" y="20" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">Senior Laravel &amp; Vue Engineer (Dhaka, Hybrid)</text>
      <text x="360" y="20" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="700">● 48 Total Applicants</text>
    </g>

    <!-- ── KANBAN PIPELINE BOARD ───────────────────────────── -->
    <g transform="translate(30, 160)">
      
      <!-- Column 1: Sourced / Applied (18) -->
      <g transform="translate(0, 0)">
        <rect width="250" height="415" rx="12" fill="url(#kanbanColBg)" stroke="#233052" stroke-width="1" />
        <rect width="250" height="38" rx="12" fill="#182342" />
        <circle cx="20" cy="19" r="4" fill="#94A3B8" />
        <text x="32" y="23" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="700">Applied (18)</text>

        <!-- Card 1 -->
        <g transform="translate(12, 50)">
