          <text x="49" y="68" fill="#D8B4FE" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">Architecture</text>
          <rect x="90" y="55" width="55" height="18" rx="4" fill="#1E3A8A" />
