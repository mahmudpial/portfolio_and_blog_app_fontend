<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="inv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091216"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#061E1A"/>
    </linearGradient>
    <linearGradient id="inv-lime-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#84CC16"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <radialGradient id="inv-orb-1" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#84CC16" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#84CC16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="inv-orb-2" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <filter id="inv-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#inv-bg)"/>
  <rect width="1200" height="675" fill="url(#inv-orb-1)"/>
  <rect width="1200" height="675" fill="url(#inv-orb-2)"/>

  <!-- Top Bar -->
  <rect x="50" y="40" width="1100" height="60" rx="16" fill="#132326" fill-opacity="0.9" stroke="#1D3E3A" stroke-width="1.5"/>
  <circle cx="80" cy="70" r="6" fill="#EF4444"/>
  <circle cx="100" cy="70" r="6" fill="#F59E0B"/>
  <circle cx="120" cy="70" r="6" fill="#10B981"/>
  
  <text x="160" y="75" fill="#F0FDF4" font-family="system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1">STOCKFLOW // MULTI-WAREHOUSE INVENTORY &amp; POS</text>
  
  <rect x="850" y="55" width="145" height="30" rx="8" fill="#84CC16" fill-opacity="0.15" stroke="#84CC16" stroke-width="1"/>
  <text x="922" y="75" fill="#A3E635" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">● 4 WAREHOUSES</text>
  
  <rect x="1010" y="55" width="120" height="30" rx="8" fill="#14B8A6" fill-opacity="0.15" stroke="#14B8A6" stroke-width="1"/>
  <text x="1070" y="75" fill="#2DD4BF" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">BARCODE SCAN</text>

  <!-- Left: Live SKU Inventory & Stock Levels Table -->
  <g transform="translate(50, 120)">
    <rect width="680" height="495" rx="20" fill="#0A181C" fill-opacity="0.9" stroke="#1D3E3A" stroke-width="1.5"/>
    
    <text x="30" y="45" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Real-Time Stock Inventory &amp; Bin Allocation</text>
    <text x="30" y="68" fill="#99F6E4" font-family="system-ui, sans-serif" font-size="12">Central Depot — Automatic Reorder Threshold Active</text>

    <!-- Top Stats -->
    <g transform="translate(30, 95)">
      <rect width="195" height="85" rx="12" fill="#0E2328" stroke="#1D3E3A" stroke-width="1"/>
      <text x="16" y="26" fill="#A3E635" font-size="11" font-weight="700">TOTAL ACTIVE SKUS</text>
      <text x="16" y="58" fill="#FFFFFF" font-size="24" font-weight="800">12,480</text>
      <text x="16" y="76" fill="#84CC16" font-size="10">● 98.4% in-stock rate</text>
    </g>

    <g transform="translate(240, 95)">
      <rect width="195" height="85" rx="12" fill="#0E2328" stroke="#1D3E3A" stroke-width="1"/>
      <text x="16" y="26" fill="#F87171" font-size="11" font-weight="700">LOW STOCK ALERTS</text>
      <text x="16" y="58" fill="#EF4444" font-size="24" font-weight="800">14 Items</text>
      <text x="16" y="76" fill="#FCA5A5" font-size="10">▲ PO auto-drafted</text>
    </g>

    <g transform="translate(450, 95)">
      <rect width="200" height="85" rx="12" fill="#0E2328" stroke="#1D3E3A" stroke-width="1"/>
      <text x="16" y="26" fill="#2DD4BF" font-size="11" font-weight="700">DAILY DISPATCH</text>
      <text x="16" y="58" fill="#14B8A6" font-size="24" font-weight="800">1,840 Units</text>
      <text x="16" y="76" fill="#99F6E4" font-size="10">Avg pick: 1.8 mins</text>
    </g>

    <!-- SKU List Table -->
    <g transform="translate(30, 205)">
      <rect width="620" height="260" rx="14" fill="#071216" stroke="#132F34" stroke-width="1"/>
      
      <!-- Table Header -->
      <text x="25" y="30" fill="#94A3B8" font-size="11" font-weight="700">BARCODE / SKU</text>
      <text x="180" y="30" fill="#94A3B8" font-size="11" font-weight="700">PRODUCT NAME</text>
      <text x="370" y="30" fill="#94A3B8" font-size="11" font-weight="700">LOCATION</text>
      <text x="470" y="30" fill="#94A3B8" font-size="11" font-weight="700">STOCK</text>
      <text x="590" y="30" fill="#94A3B8" font-size="11" font-weight="700" text-anchor="end">STATUS</text>
      <line x1="20" y1="42" x2="600" y2="42" stroke="#132F34" stroke-width="1"/>

      <!-- Item 1 -->
      <text x="25" y="75" fill="#A3E635" font-family="monospace" font-size="12">8901023881</text>
      <text x="180" y="75" fill="#FFFFFF" font-size="13" font-weight="600">Smart Thermal Sensor X2</text>
      <text x="370" y="75" fill="#99F6E4" font-size="12">Aisle 04 · Bin B-12</text>
      <text x="470" y="75" fill="#FFFFFF" font-size="13" font-weight="700">420 pcs</text>
      <text x="590" y="75" fill="#84CC16" font-size="11" font-weight="700" text-anchor="end">IN STOCK</text>

      <!-- Item 2 -->
      <text x="25" y="125" fill="#A3E635" font-family="monospace" font-size="12">8901023899</text>
      <text x="180" y="125" fill="#FFFFFF" font-size="13" font-weight="600">Ultra Fiber Optical Patch</text>
      <text x="370" y="125" fill="#99F6E4" font-size="12">Aisle 01 · Bin A-08</text>
      <text x="470" y="125" fill="#F87171" font-size="13" font-weight="700">12 pcs</text>
      <text x="590" y="125" fill="#EF4444" font-size="11" font-weight="700" text-anchor="end">LOW STOCK</text>

      <!-- Item 3 -->
      <text x="25" y="175" fill="#A3E635" font-family="monospace" font-size="12">8901024012</text>
      <text x="180" y="175" fill="#FFFFFF" font-size="13" font-weight="600">Gigabit PoE Switch 16-Port</text>
      <text x="370" y="175" fill="#99F6E4" font-size="12">Aisle 08 · Bin D-02</text>
      <text x="470" y="175" fill="#FFFFFF" font-size="13" font-weight="700">85 pcs</text>
      <text x="590" y="175" fill="#84CC16" font-size="11" font-weight="700" text-anchor="end">IN STOCK</text>

      <!-- Item 4 -->
      <text x="25" y="225" fill="#A3E635" font-family="monospace" font-size="12">8901024550</text>
      <text x="180" y="225" fill="#FFFFFF" font-size="13" font-weight="600">Industrial Power Supply 24V</text>
      <text x="370" y="225" fill="#99F6E4" font-size="12">Aisle 03 · Bin C-14</text>
      <text x="470" y="225" fill="#FFFFFF" font-size="13" font-weight="700">310 pcs</text>
      <text x="590" y="225" fill="#84CC16" font-size="11" font-weight="700" text-anchor="end">IN STOCK</text>
    </g>
  </g>

  <!-- Right: Fast POS Checkout & Barcode HUD -->
  <g transform="translate(755, 120)">
    <rect width="395" height="495" rx="20" fill="#0A181C" fill-opacity="0.9" stroke="#1D3E3A" stroke-width="1.5"/>
    
    <text x="25" y="45" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="17" font-weight="700">High-Speed POS Terminal</text>
    <text x="25" y="68" fill="#99F6E4" font-family="system-ui, sans-serif" font-size="12">Cashier Station #04 — Scanner Online</text>

    <!-- Barcode Scanner Viewfinder Box -->
    <g transform="translate(25, 95)">
      <rect width="345" height="150" rx="14" fill="#040C0E" stroke="#84CC16" stroke-width="1.5"/>
      
      <!-- Barcode Graphic -->
      <g transform="translate(80, 30)">
        <rect x="0" y="0" width="4" height="60" fill="#E2E8F0"/>
        <rect x="8" y="0" width="8" height="60" fill="#E2E8F0"/>
        <rect x="20" y="0" width="4" height="60" fill="#E2E8F0"/>
        <rect x="28" y="0" width="12" height="60" fill="#E2E8F0"/>
        <rect x="44" y="0" width="4" height="60" fill="#E2E8F0"/>
        <rect x="52" y="0" width="6" height="60" fill="#E2E8F0"/>
        <rect x="62" y="0" width="10" height="60" fill="#E2E8F0"/>
        <rect x="76" y="0" width="4" height="60" fill="#E2E8F0"/>
        <rect x="84" y="0" width="14" height="60" fill="#E2E8F0"/>
        <rect x="102" y="0" width="6" height="60" fill="#E2E8F0"/>
        <rect x="112" y="0" width="8" height="60" fill="#E2E8F0"/>
        <rect x="124" y="0" width="4" height="60" fill="#E2E8F0"/>
        <rect x="132" y="0" width="12" height="60" fill="#E2E8F0"/>
        <rect x="148" y="0" width="4" height="60" fill="#E2E8F0"/>
        <rect x="156" y="0" width="10" height="60" fill="#E2E8F0"/>
        <rect x="170" y="0" width="6" height="60" fill="#E2E8F0"/>
        <rect x="180" y="0" width="8" height="60" fill="#E2E8F0"/>
      </g>
      
      <!-- Laser Scan Line -->
      <line x1="20" y1="60" x2="325" y2="60" stroke="#EF4444" stroke-width="2.5" filter="url(#inv-glow)"/>

      <text x="172" y="125" fill="#A3E635" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">SCANNED: 8901024012 (MATCHED)</text>
    </g>

    <!-- Cashier Cart Total & Action -->
    <g transform="translate(25, 270)">
      <rect width="345" height="195" rx="14" fill="#0E2328" stroke="#1D3E3A" stroke-width="1"/>
      
      <text x="20" y="32" fill="#99F6E4" font-size="12">Subtotal (3 Items):</text>
      <text x="325" y="32" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="end">$340.00</text>

      <text x="20" y="60" fill="#99F6E4" font-size="12">VAT (5%):</text>
      <text x="325" y="60" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="end">$17.00</text>

      <line x1="20" y1="80" x2="325" y2="80" stroke="#1D3E3A" stroke-width="1"/>

      <text x="20" y="110" fill="#FFFFFF" font-size="15" font-weight="800">Total Payable:</text>
      <text x="325" y="110" fill="#A3E635" font-size="20" font-weight="800" text-anchor="end">$357.00</text>

      <!-- Pay Button -->
      <rect x="20" y="130" width="305" height="45" rx="12" fill="url(#inv-lime-teal)" filter="url(#inv-glow)"/>
      <text x="172" y="158" fill="#04130C" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">COMPLETE CHECKOUT (ENTER)</text>
    </g>
  </g>
</svg>
