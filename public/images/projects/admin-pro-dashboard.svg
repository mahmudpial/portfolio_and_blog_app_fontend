<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="adminBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080714" />
      <stop offset="50%" stop-color="#120E22" />
      <stop offset="100%" stop-color="#191230" />
    </linearGradient>

    <linearGradient id="adminCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18132E" />
      <stop offset="100%" stop-color="#110E20" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <filter id="adminShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#adminBg)" />

  <g transform="translate(40, 30)">
    <rect width="1120" height="615" rx="16" fill="#110E20" stroke="#2E214A" stroke-width="1.5" filter="url(#adminShadow)" />

    <!-- Window Top -->
    <rect width="1120" height="46" rx="16" fill="#0A0815" />
    <path d="M0 46 L1120 46" stroke="#201736" stroke-width="1" />

    <circle cx="24" cy="23" r="6" fill="#EF4444" opacity="0.8" />
    <circle cx="44" cy="23" r="6" fill="#F59E0B" opacity="0.8" />
    <circle cx="64" cy="23" r="6" fill="#10B981" opacity="0.8" />

    <rect x="350" y="10" width="420" height="26" rx="8" fill="#17122C" stroke="#2B1E48" stroke-width="1" />
    <text x="375" y="27" fill="#C084FC" font-family="monospace" font-size="11">⚡ https://adminpro.cloud/analytics/overview</text>

    <!-- Header Navigation -->
    <g transform="translate(30, 65)">
      <rect width="36" height="36" rx="10" fill="url(#purpleGlow)" />
      <path d="M12 24 L12 18 M18 24 L18 12 M24 24 L24 15" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <text x="48" y="22" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="800">Admin <tspan fill="#C084FC">Pro</tspan></text>
      <text x="48" y="34" fill="#94A3B8" font-family="sans-serif" font-size="10">REAL-TIME SYSTEM METRICS &amp; CLUSTER TELEMETRY</text>

      <rect x="940" y="4" width="120" height="32" rx="8" fill="#052E16" stroke="#16A34A" stroke-width="1" />
      <circle cx="956" cy="20" r="4" fill="#4ADE80" />
      <text x="968" y="24" fill="#4ADE80" font-family="sans-serif" font-size="11" font-weight="700">Cluster 99.98%</text>
    </g>

    <!-- Top Metrics Row -->
    <g transform="translate(30, 125)">
      <g transform="translate(0, 0)">
        <rect width="250" height="95" rx="12" fill="url(#adminCardBg)" stroke="#2B1E48" stroke-width="1" />
        <text x="16" y="26" fill="#9CA3AF" font-family="sans-serif" font-size="11" font-weight="600">ACTIVE SESSIONS</text>
        <text x="16" y="58" fill="#FFFFFF" font-family="sans-serif" font-size="26" font-weight="800">1,842 <tspan fill="#10B981" font-size="13">Live</tspan></text>
        <text x="16" y="80" fill="#6B7280" font-family="sans-serif" font-size="10">+24% vs last hour</text>
      </g>

      <g transform="translate(270, 0)">
        <rect width="250" height="95" rx="12" fill="url(#adminCardBg)" stroke="#2B1E48" stroke-width="1" />
        <text x="16" y="26" fill="#9CA3AF" font-family="sans-serif" font-size="11" font-weight="600">CPU UTILIZATION</text>
        <text x="16" y="58" fill="#FFFFFF" font-family="sans-serif" font-size="26" font-weight="800">28.4% <tspan fill="#8B5CF6" font-size="13">8 Cores</tspan></text>
        <rect x="16" y="72" width="218" height="6" rx="3" fill="#201538" />
        <rect x="16" y="72" width="62" height="6" rx="3" fill="#8B5CF6" />
      </g>

      <g transform="translate(540, 0)">
        <rect width="250" height="95" rx="12" fill="url(#adminCardBg)" stroke="#2B1E48" stroke-width="1" />
        <text x="16" y="26" fill="#9CA3AF" font-family="sans-serif" font-size="11" font-weight="600">API THROUGHPUT</text>
        <text x="16" y="58" fill="#FFFFFF" font-family="sans-serif" font-size="26" font-weight="800">4,210 <tspan fill="#38BDF8" font-size="13">req/min</tspan></text>
        <text x="16" y="80" fill="#6B7280" font-family="sans-serif" font-size="10">Avg Response: 42ms</text>
      </g>

      <g transform="translate(810, 0)">
        <rect width="250" height="95" rx="12" fill="url(#adminCardBg)" stroke="#2B1E48" stroke-width="1" />
        <text x="16" y="26" fill="#9CA3AF" font-family="sans-serif" font-size="11" font-weight="600">DATABASE IOPS</text>
        <text x="16" y="58" fill="#FFFFFF" font-family="sans-serif" font-size="26" font-weight="800">860 <tspan fill="#F59E0B" font-size="13">MySQL</tspan></text>
        <text x="16" y="80" fill="#10B981" font-family="sans-serif" font-size="10">✓ Connection Pool Healthy</text>
      </g>
    </g>

    <!-- Main Chart & Real-Time Security Log -->
    <g transform="translate(30, 240)">
      
      <!-- Chart Left -->
      <g transform="translate(0, 0)">
        <rect width="660" height="335" rx="14" fill="url(#adminCardBg)" stroke="#2B1E48" stroke-width="1" />
        <text x="24" y="28" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">Real-Time Traffic &amp; Request Latency Distribution</text>
        
        <!-- Graph Lines -->
        <g transform="translate(24, 60)">
          <line x1="0" y1="50" x2="610" y2="50" stroke="#22163B" stroke-dasharray="3 3" />
          <line x1="0" y1="110" x2="610" y2="110" stroke="#22163B" stroke-dasharray="3 3" />
          <line x1="0" y1="170" x2="610" y2="170" stroke="#22163B" stroke-dasharray="3 3" />
          <line x1="0" y1="220" x2="610" y2="220" stroke="#2B1E48" />

          <!-- Bars -->
          <rect x="30" y="80" width="22" height="140" rx="5" fill="#8B5CF6" opacity="0.85" />
          <rect x="75" y="50" width="22" height="170" rx="5" fill="#8B5CF6" />
          <rect x="120" y="90" width="22" height="130" rx="5" fill="#8B5CF6" opacity="0.85" />
          <rect x="165" y="30" width="22" height="190" rx="5" fill="#C084FC" />
          <rect x="210" y="70" width="22" height="150" rx="5" fill="#8B5CF6" opacity="0.85" />
          <rect x="255" y="40" width="22" height="180" rx="5" fill="#C084FC" />
          <rect x="300" y="60" width="22" height="160" rx="5" fill="#8B5CF6" opacity="0.85" />
          <rect x="345" y="20" width="22" height="200" rx="5" fill="#38BDF8" />
          <rect x="390" y="50" width="22" height="170" rx="5" fill="#8B5CF6" opacity="0.85" />
          <rect x="435" y="30" width="22" height="190" rx="5" fill="#C084FC" />
          <rect x="480" y="80" width="22" height="140" rx="5" fill="#8B5CF6" opacity="0.85" />
          <rect x="525" y="40" width="22" height="180" rx="5" fill="#C084FC" />
          <rect x="570" y="60" width="22" height="160" rx="5" fill="#8B5CF6" opacity="0.85" />
        </g>
      </g>

      <!-- Right System Status Stream -->
      <g transform="translate(680, 0)">
        <rect width="380" height="335" rx="14" fill="url(#adminCardBg)" stroke="#2B1E48" stroke-width="1" />
        <text x="20" y="28" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">Cluster Services Health</text>

        <g transform="translate(20, 50)">
          <!-- Item 1 -->
          <rect width="340" height="54" rx="10" fill="#140E24" stroke="#22163B" stroke-width="1" />
          <circle cx="20" cy="27" r="5" fill="#10B981" />
          <text x="36" y="24" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">Primary DB (PostgreSQL 16)</text>
          <text x="36" y="38" fill="#94A3B8" font-family="sans-serif" font-size="9">Read Replica Sync: 0ms lag</text>
          <text x="320" y="32" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="end">ONLINE</text>

          <!-- Item 2 -->
          <g transform="translate(0, 64)">
            <rect width="340" height="54" rx="10" fill="#140E24" stroke="#22163B" stroke-width="1" />
            <circle cx="20" cy="27" r="5" fill="#10B981" />
            <text x="36" y="24" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">Redis Cache Cluster</text>
            <text x="36" y="38" fill="#94A3B8" font-family="sans-serif" font-size="9">Hit Rate: 98.4% (3.2 GB RAM)</text>
            <text x="320" y="32" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="end">ONLINE</text>
          </g>

          <!-- Item 3 -->
          <g transform="translate(0, 128)">
            <rect width="340" height="54" rx="10" fill="#140E24" stroke="#22163B" stroke-width="1" />
            <circle cx="20" cy="27" r="5" fill="#10B981" />
            <text x="36" y="24" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">Queue Worker Daemons</text>
            <text x="36" y="38" fill="#94A3B8" font-family="sans-serif" font-size="9">12 Active Workers • 0 Failed</text>
            <text x="320" y="32" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="end">ONLINE</text>
          </g>

          <!-- Item 4 -->
          <g transform="translate(0, 192)">
            <rect width="340" height="54" rx="10" fill="#140E24" stroke="#22163B" stroke-width="1" />
            <circle cx="20" cy="27" r="5" fill="#38BDF8" />
            <text x="36" y="24" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">Nginx Reverse Proxy</text>
            <text x="36" y="38" fill="#94A3B8" font-family="sans-serif" font-size="9">SSL Auto-Renewed • HTTP/2</text>
            <text x="320" y="32" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="end">STABLE</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
