<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="fin-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04130C"/>
      <stop offset="50%" stop-color="#092419"/>
      <stop offset="100%" stop-color="#061210"/>
    </linearGradient>
    <linearGradient id="fin-card-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="fin-card-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="fin-emerald-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="fin-orb-1" cx="15%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fin-orb-2" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <filter id="fin-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="fin-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#064E3B" stroke-width="0.7" opacity="0.4"/>
      <circle cx="30" cy="0" r="1.2" fill="#10B981" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#fin-bg)"/>
  <rect width="1200" height="675" fill="url(#fin-orb-1)"/>
  <rect width="1200" height="675" fill="url(#fin-orb-2)"/>
  <rect width="1200" height="675" fill="url(#fin-grid)"/>

  <!-- Top Glass Header -->
  <rect x="50" y="40" width="1100" height="60" rx="16" fill="#0A1E16" fill-opacity="0.85" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="80" cy="70" r="6" fill="#EF4444"/>
  <circle cx="100" cy="70" r="6" fill="#F59E0B"/>
  <circle cx="120" cy="70" r="6" fill="#10B981"/>
  
  <text x="160" y="75" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" letter-spacing="1">PAYFLOW // MULTI-GATEWAY FINTECH PORTAL</text>
  
  <rect x="860" y="55" width="140" height="30" rx="8" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
  <text x="930" y="75" fill="#34D399" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">● STRIPE &amp; BKASH</text>
  
  <rect x="1015" y="55" width="115" height="30" rx="8" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1"/>
  <text x="1072" y="75" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">SSLCOMMERZ</text>

  <!-- Left: Metric Cards & Financial Bar Charts -->
  <g transform="translate(50, 120)">
    <!-- Main Revenue Box -->
    <rect width="680" height="495" rx="20" fill="#081A12" fill-opacity="0.9" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
    
    <text x="30" y="45" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Financial Overview &amp; Settled Payouts</text>
    <text x="30" y="68" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="12">Real-time webhook reconciliation across 4 gateways</text>
    
    <!-- Top 3 Stat Badges -->
