      <path d="M 90 26 Q 103 41, 90 56" fill="none" stroke="#FBBF24" stroke-width="2"/>

      <text x="25" y="110" fill="#FFFFFF" font-family="monospace" font-size="18" font-weight="700" letter-spacing="3">••••  ••••  ••••  8842</text>
      <text x="25" y="145" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="9" font-weight="600">CARD HOLDER</text>
      <text x="25" y="165" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">PIAL MAHMUD</text>

      <text x="230" y="145" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="9" font-weight="600">EXPIRES</text>
      <text x="230" y="165" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700">09/29</text>
