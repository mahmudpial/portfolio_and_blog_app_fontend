      <rect x="140" y="110" width="28" height="120" rx="6" fill="#10B981" fill-opacity="0.5"/>
      <rect x="185" y="140" width="28" height="90" rx="6" fill="#10B981" fill-opacity="0.4"/>
      <rect x="230" y="90" width="28" height="140" rx="6" fill="#10B981" fill-opacity="0.6"/>
      <rect x="275" y="70" width="28" height="160" rx="6" fill="#10B981" fill-opacity="0.7"/>
      <rect x="320" y="100" width="28" height="130" rx="6" fill="#10B981" fill-opacity="0.5"/>
      <rect x="365" y="60" width="28" height="170" rx="6" fill="#F59E0B" fill-opacity="0.8"/>
      <rect x="410" y="80" width="28" height="150" rx="6" fill="#10B981" fill-opacity="0.7"/>
      <rect x="455" y="50" width="28" height="180" rx="6" fill="#10B981" fill-opacity="0.8"/>
      <rect x="500" y="40" width="28" height="190" rx="6" fill="url(#fin-emerald-gold)" filter="url(#fin-glow)"/>
