      <text x="16" y="26" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">LOCAL PAYOUT (BDT)</text>
      <text x="16" y="58" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="24" font-weight="800">৳3,420,500</text>
      <text x="16" y="76" fill="#34D399" font-family="system-ui, sans-serif" font-size="10">● bKash &amp; Nagad Auto</text>
    </g>

    <g transform="translate(450, 95)">
