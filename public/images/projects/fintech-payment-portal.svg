      <line x1="25" y1="41" x2="67" y2="41" stroke="#92400E" stroke-width="1"/>
      <line x1="46" y1="25" x2="46" y2="57" stroke="#92400E" stroke-width="1"/>
      
      <!-- Contactless Icon -->
