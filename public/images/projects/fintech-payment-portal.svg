      <text x="109" y="245" fill="#6EE7B7" font-size="10" text-anchor="middle">FEB</text>
      <text x="154" y="245" fill="#6EE7B7" font-size="10" text-anchor="middle">MAR</text>
      <text x="199" y="245" fill="#6EE7B7" font-size="10" text-anchor="middle">APR</text>
      <text x="244" y="245" fill="#6EE7B7" font-size="10" text-anchor="middle">MAY</text>
      <text x="289" y="245" fill="#6EE7B7" font-size="10" text-anchor="middle">JUN</text>
      <text x="334" y="245" fill="#6EE7B7" font-size="10" text-anchor="middle">JUL</text>
      <text x="379" y="245" fill="#FBBF24" font-size="10" text-anchor="middle" font-weight="700">AUG</text>
      <text x="424" y="245" fill="#6EE7B7" font-size="10" text-anchor="middle">SEP</text>
      <text x="469" y="245" fill="#6EE7B7" font-size="10" text-anchor="middle">OCT</text>
      <text x="514" y="245" fill="#34D399" font-size="10" text-anchor="middle" font-weight="700">NOV</text>
      <text x="559" y="245" fill="#6EE7B7" font-size="10" text-anchor="middle">DEC</text>
    </g>
