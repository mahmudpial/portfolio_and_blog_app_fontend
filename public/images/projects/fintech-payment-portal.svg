      <text x="335" y="15" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">Auto-Sync</text>

      <!-- Row 1 -->
      <g transform="translate(0, 30)">
        <rect width="335" height="52" rx="10" fill="#04130C" stroke="#064E3B" stroke-width="1"/>
        <circle cx="26" cy="26" r="14" fill="#635BFF" fill-opacity="0.2"/>
        <text x="26" y="31" fill="#635BFF" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">S</text>
        <text x="50" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Stripe SaaS Sub</text>
        <text x="50" y="40" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="10">charge.successful</text>
        <text x="320" y="32" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="end">+$129.00</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 92)">
        <rect width="335" height="52" rx="10" fill="#04130C" stroke="#064E3B" stroke-width="1"/>
        <circle cx="26" cy="26" r="14" fill="#E2136E" fill-opacity="0.2"/>
        <text x="26" y="31" fill="#E2136E" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">৳</text>
        <text x="50" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600">bKash Merchant Pay</text>
        <text x="50" y="40" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="10">TXN_ID: 8B99X10Q</text>
        <text x="320" y="32" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="end">+৳4,500</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 154)">
        <rect width="335" height="52" rx="10" fill="#04130C" stroke="#064E3B" stroke-width="1"/>
        <circle cx="26" cy="26" r="14" fill="#0070BA" fill-opacity="0.2"/>
        <text x="26" y="31" fill="#0070BA" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">P</text>
        <text x="50" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600">PayPal Express</text>
        <text x="50" y="40" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="10">PAYID-MQ98311</text>
        <text x="320" y="32" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="end">+$450.00</text>
