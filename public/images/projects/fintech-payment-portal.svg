      <text x="16" y="26" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">TOTAL REVENUE (USD)</text>
      <text x="16" y="58" fill="#34D399" font-family="system-ui, sans-serif" font-size="24" font-weight="800">$248,920</text>
      <text x="16" y="76" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="10">▲ +18.4% this month</text>
    </g>

    <g transform="translate(240, 95)">
