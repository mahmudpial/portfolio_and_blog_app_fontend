<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="dev-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A10"/>
      <stop offset="50%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#180A12"/>
    </linearGradient>
    <linearGradient id="dev-flame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="dev-orb-1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dev-orb-2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="dev-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#dev-bg)"/>
  <rect width="1200" height="675" fill="url(#dev-orb-1)"/>
  <rect width="1200" height="675" fill="url(#dev-orb-2)"/>

  <!-- Top Glass Bar -->
  <rect x="50" y="40" width="1100" height="60" rx="16" fill="#111827" fill-opacity="0.9" stroke="#374151" stroke-width="1.5"/>
  <circle cx="80" cy="70" r="6" fill="#EF4444"/>
  <circle cx="100" cy="70" r="6" fill="#F59E0B"/>
  <circle cx="120" cy="70" r="6" fill="#10B981"/>
  
  <text x="160" y="75" fill="#F9FAFB" font-family="system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1">DEVPULSE // REAL-TIME API &amp; SERVER HEALTH MONITOR</text>
  
  <rect x="850" y="55" width="140" height="30" rx="8" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
  <text x="920" y="75" fill="#34D399" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">● ALL SYSTEMS UP</text>
  
  <rect x="1005" y="55" width="125" height="30" rx="8" fill="#F97316" fill-opacity="0.15" stroke="#F97316" stroke-width="1"/>
  <text x="1067" y="75" fill="#FB923C" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">UPTIME: 99.99%</text>

  <!-- Left: Global Microservice Latency Waveform & Cluster Health -->
  <g transform="translate(50, 120)">
    <rect width="680" height="495" rx="20" fill="#0A0F1D" fill-opacity="0.9" stroke="#1F2937" stroke-width="1.5"/>
    
    <text x="30" y="45" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Microservice Latency &amp; Response Times</text>
    <text x="30" y="68" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="12">12 Global Probe Regions — Synthetic API Polling (every 10s)</text>

    <!-- Top 3 Metrics -->
    <g transform="translate(30, 95)">
      <rect width="195" height="85" rx="12" fill="#111827" stroke="#1F2937" stroke-width="1"/>
      <text x="16" y="26" fill="#FB923C" font-size="11" font-weight="700">GLOBAL AVG LATENCY</text>
      <text x="16" y="58" fill="#FFFFFF" font-size="24" font-weight="800">18.4ms</text>
      <text x="16" y="76" fill="#10B981" font-size="10">● Ultra-fast response</text>
    </g>

    <g transform="translate(240, 95)">
      <rect width="195" height="85" rx="12" fill="#111827" stroke="#1F2937" stroke-width="1"/>
      <text x="16" y="26" fill="#9CA3AF" font-size="11" font-weight="700">ACTIVE APIS MONITORED</text>
      <text x="16" y="58" fill="#38BDF8" font-size="24" font-weight="800">42 Endpoints</text>
      <text x="16" y="76" fill="#38BDF8" font-size="10">REST &amp; GraphQL v2</text>
    </g>

    <g transform="translate(450, 95)">
      <rect width="200" height="85" rx="12" fill="#111827" stroke="#1F2937" stroke-width="1"/>
      <text x="16" y="26" fill="#34D399" font-size="11" font-weight="700">FAILED REQUESTS</text>
      <text x="16" y="58" fill="#34D399" font-size="24" font-weight="800">0.00%</text>
      <text x="16" y="76" fill="#9CA3AF" font-size="10">Last incident: 42d ago</text>
    </g>

    <!-- Latency Realtime Waveform Chart -->
    <g transform="translate(30, 205)">
      <rect width="620" height="260" rx="14" fill="#030712" stroke="#1F2937" stroke-width="1"/>
      <text x="25" y="32" fill="#F3F4F6" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Real-time HTTP Latency Trace (ms)</text>

      <!-- Grid lines -->
      <line x1="25" y1="70" x2="595" y2="70" stroke="#1F2937" stroke-width="0.8" stroke-dasharray="4 4"/>
      <line x1="25" y1="120" x2="595" y2="120" stroke="#1F2937" stroke-width="0.8" stroke-dasharray="4 4"/>
      <line x1="25" y1="170" x2="595" y2="170" stroke="#1F2937" stroke-width="0.8" stroke-dasharray="4 4"/>
      <line x1="25" y1="220" x2="595" y2="220" stroke="#1F2937" stroke-width="0.8"/>

      <!-- Waveform curves -->
      <path d="M 30 180 Q 80 150, 130 160 T 230 120 T 330 140 T 430 80 T 530 130 T 590 90" fill="none" stroke="url(#dev-flame)" stroke-width="3" filter="url(#dev-glow)"/>
      
      <circle cx="590" cy="90" r="5" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/>
      <text x="520" y="80" fill="#F87171" font-family="monospace" font-size="11" font-weight="700">Peak: 22ms</text>
    </g>
  </g>

  <!-- Right: Node Locations & Webhook Status -->
  <g transform="translate(755, 120)">
    <rect width="395" height="495" rx="20" fill="#0A0F1D" fill-opacity="0.9" stroke="#1F2937" stroke-width="1.5"/>
    
    <text x="25" y="45" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Edge Cluster Nodes</text>
    <text x="25" y="68" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="12">Multi-zone CDN &amp; Health Checks</text>

    <!-- Node 1: US-East -->
    <g transform="translate(25, 95)">
      <rect width="345" height="70" rx="12" fill="#111827" stroke="#1F2937" stroke-width="1"/>
      <circle cx="28" cy="35" r="8" fill="#10B981" style="filter:drop-shadow(0 0 6px #10B981);"/>
      <text x="48" y="30" fill="#FFFFFF" font-size="13" font-weight="700">us-east-1 (N. Virginia)</text>
      <text x="48" y="48" fill="#9CA3AF" font-size="11">HTTP 200 · Latency: 12ms · Load: 34%</text>
      <text x="325" y="40" fill="#34D399" font-size="12" font-weight="700" text-anchor="end">HEALTHY</text>
    </g>

    <!-- Node 2: EU-Frankfurt -->
    <g transform="translate(25, 180)">
      <rect width="345" height="70" rx="12" fill="#111827" stroke="#1F2937" stroke-width="1"/>
      <circle cx="28" cy="35" r="8" fill="#10B981" style="filter:drop-shadow(0 0 6px #10B981);"/>
      <text x="48" y="30" fill="#FFFFFF" font-size="13" font-weight="700">eu-central-1 (Frankfurt)</text>
      <text x="48" y="48" fill="#9CA3AF" font-size="11">HTTP 200 · Latency: 19ms · Load: 28%</text>
      <text x="325" y="40" fill="#34D399" font-size="12" font-weight="700" text-anchor="end">HEALTHY</text>
    </g>

    <!-- Node 3: AP-Singapore -->
    <g transform="translate(25, 265)">
      <rect width="345" height="70" rx="12" fill="#111827" stroke="#1F2937" stroke-width="1"/>
      <circle cx="28" cy="35" r="8" fill="#10B981" style="filter:drop-shadow(0 0 6px #10B981);"/>
      <text x="48" y="30" fill="#FFFFFF" font-size="13" font-weight="700">ap-southeast-1 (Singapore)</text>
      <text x="48" y="48" fill="#9CA3AF" font-size="11">HTTP 200 · Latency: 24ms · Load: 45%</text>
      <text x="325" y="40" fill="#34D399" font-size="12" font-weight="700" text-anchor="end">HEALTHY</text>
    </g>

    <!-- Lower Alert Dispatch Console -->
    <g transform="translate(25, 355)">
      <rect width="345" height="110" rx="14" fill="#030712" stroke="#374151" stroke-width="1"/>
      <text x="20" y="30" fill="#F97316" font-family="monospace" font-size="11" font-weight="700">[ALERT DISPATCH: DISCORD &amp; SLACK]</text>
      <text x="20" y="55" fill="#9CA3AF" font-family="monospace" font-size="11">● Webhook sent to #dev-ops-channel</text>
      <text x="20" y="75" fill="#9CA3AF" font-family="monospace" font-size="11">● SSL Cert auto-renewed (Expires in 89d)</text>
      <text x="20" y="95" fill="#34D399" font-family="monospace" font-size="11">● All synthetic health-checks PASSED</text>
    </g>
  </g>
</svg>
