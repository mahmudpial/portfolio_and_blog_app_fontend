<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="tradeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0E1624" />
      <stop offset="100%" stop-color="#191924" />
    </linearGradient>

    <linearGradient id="emeraldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="tradeCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E2F" />
      <stop offset="100%" stop-color="#0E1422" />
    </linearGradient>

    <filter id="tradeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#tradeBg)" />

  <g transform="translate(40, 30)">
    <rect width="1120" height="615" rx="16" fill="#0E1422" stroke="#23324E" stroke-width="1.5" filter="url(#tradeShadow)" />

    <!-- Window Top -->
    <rect width="1120" height="46" rx="16" fill="#0A0E18" />
    <path d="M0 46 L1120 46" stroke="#1B2538" stroke-width="1" />

    <circle cx="24" cy="23" r="6" fill="#EF4444" opacity="0.8" />
    <circle cx="44" cy="23" r="6" fill="#F59E0B" opacity="0.8" />
    <circle cx="64" cy="23" r="6" fill="#10B981" opacity="0.8" />

    <rect x="350" y="10" width="420" height="26" rx="8" fill="#141C2C" stroke="#23304A" stroke-width="1" />
    <text x="375" y="27" fill="#34D399" font-family="monospace" font-size="11">📈 https://oniontrade.market/exchange/spot-terminal</text>

    <!-- Header -->
    <g transform="translate(30, 65)">
      <rect width="36" height="36" rx="10" fill="url(#emeraldGold)" />
      <text x="18" y="24" fill="#FFFFFF" font-size="16" text-anchor="middle">🧅</text>
      <text x="48" y="22" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="800">OnionTrade <tspan fill="#10B981">Pro</tspan></text>
      <text x="48" y="34" fill="#94A3B8" font-family="sans-serif" font-size="10">COMMODITY SUPPLY CHAIN &amp; LIVE B2B WHOLESALE EXCHANGE</text>

      <rect x="910" y="4" width="150" height="32" rx="8" fill="#064E3B" stroke="#059669" stroke-width="1" />
      <text x="985" y="24" fill="#6EE7B7" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">● Market Open: +4.2%</text>
    </g>

    <!-- KPI Row -->
    <g transform="translate(30, 120)">
      <g transform="translate(0, 0)">
        <rect width="250" height="85" rx="12" fill="url(#tradeCard)" stroke="#23324E" stroke-width="1" />
        <text x="16" y="24" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">ONION INDEX (DESHI)</text>
        <text x="16" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="800">৳ 82.50 <tspan fill="#10B981" font-size="13">/ KG</tspan></text>
        <text x="16" y="70" fill="#10B981" font-family="sans-serif" font-size="10">▲ +3.20 (Today's Gain)</text>
      </g>

      <g transform="translate(270, 0)">
        <rect width="250" height="85" rx="12" fill="url(#tradeCard)" stroke="#23324E" stroke-width="1" />
        <text x="16" y="24" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">24H VOLUME TRADED</text>
        <text x="16" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="800">1,480 <tspan fill="#F59E0B" font-size="13">Tons</tspan></text>
        <text x="16" y="70" fill="#94A3B8" font-family="sans-serif" font-size="10">৳ 12.2 Crore Turnover</text>
      </g>

      <g transform="translate(540, 0)">
        <rect width="250" height="85" rx="12" fill="url(#tradeCard)" stroke="#23324E" stroke-width="1" />
        <text x="16" y="24" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">ACTIVE WAREHOUSES</text>
        <text x="16" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="800">28 <tspan fill="#38BDF8" font-size="13">Hubs</tspan></text>
        <text x="16" y="70" fill="#38BDF8" font-family="sans-serif" font-size="10">Khatunganj &amp; Shyambazar</text>
      </g>

      <g transform="translate(810, 0)">
        <rect width="250" height="85" rx="12" fill="url(#tradeCard)" stroke="#23324E" stroke-width="1" />
        <text x="16" y="24" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">ESCROW SETTLEMENTS</text>
        <text x="16" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="800">100% <tspan fill="#10B981" font-size="13">Guaranteed</tspan></text>
        <text x="16" y="70" fill="#10B981" font-family="sans-serif" font-size="10">✓ Automated Ledger Audit</text>
      </g>
    </g>

    <!-- Candlestick & Order Book Section -->
    <g transform="translate(30, 225)">
      
      <!-- Candlestick Chart (Left) -->
      <g transform="translate(0, 0)">
        <rect width="680" height="350" rx="14" fill="url(#tradeCard)" stroke="#23324E" stroke-width="1" />
        <text x="24" y="28" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">Price Trend &amp; Supply Candlestick (1H)</text>

        <!-- Chart Grid Lines -->
        <g transform="translate(24, 60)">
          <line x1="0" y1="50" x2="630" y2="50" stroke="#1B263B" stroke-dasharray="3 3" />
          <line x1="0" y1="120" x2="630" y2="120" stroke="#1B263B" stroke-dasharray="3 3" />
          <line x1="0" y1="190" x2="630" y2="190" stroke="#1B263B" stroke-dasharray="3 3" />
          <line x1="0" y1="240" x2="630" y2="240" stroke="#23324E" />

          <!-- Candlesticks -->
          <!-- C1 Green -->
          <line x1="40" y1="160" x2="40" y2="230" stroke="#10B981" stroke-width="1.5"/>
          <rect x="33" y="175" width="14" height="40" rx="2" fill="#10B981" />

          <!-- C2 Green -->
          <line x1="90" y1="140" x2="90" y2="210" stroke="#10B981" stroke-width="1.5"/>
          <rect x="83" y="150" width="14" height="45" rx="2" fill="#10B981" />

          <!-- C3 Red -->
          <line x1="140" y1="130" x2="140" y2="195" stroke="#EF4444" stroke-width="1.5"/>
          <rect x="133" y="145" width="14" height="35" rx="2" fill="#EF4444" />

          <!-- C4 Green -->
          <line x1="190" y1="110" x2="190" y2="180" stroke="#10B981" stroke-width="1.5"/>
          <rect x="183" y="125" width="14" height="50" rx="2" fill="#10B981" />

          <!-- C5 Green -->
          <line x1="240" y1="90" x2="240" y2="160" stroke="#10B981" stroke-width="1.5"/>
          <rect x="233" y="100" width="14" height="45" rx="2" fill="#10B981" />

          <!-- C6 Red -->
          <line x1="290" y1="80" x2="290" y2="140" stroke="#EF4444" stroke-width="1.5"/>
          <rect x="283" y="95" width="14" height="25" rx="2" fill="#EF4444" />

          <!-- C7 Green -->
          <line x1="340" y1="60" x2="340" y2="130" stroke="#10B981" stroke-width="1.5"/>
          <rect x="333" y="75" width="14" height="45" rx="2" fill="#10B981" />

          <!-- C8 Green Big Breakout -->
          <line x1="390" y1="30" x2="390" y2="110" stroke="#10B981" stroke-width="1.5"/>
          <rect x="383" y="45" width="14" height="55" rx="2" fill="#10B981" />

          <!-- C9 Green -->
          <line x1="440" y1="20" x2="440" y2="90" stroke="#10B981" stroke-width="1.5"/>
          <rect x="433" y="30" width="14" height="40" rx="2" fill="#10B981" />

          <!-- C10 Red Retest -->
          <line x1="490" y1="25" x2="490" y2="85" stroke="#EF4444" stroke-width="1.5"/>
          <rect x="483" y="35" width="14" height="25" rx="2" fill="#EF4444" />

          <!-- C11 Green -->
          <line x1="540" y1="10" x2="540" y2="70" stroke="#10B981" stroke-width="1.5"/>
          <rect x="533" y="20" width="14" height="45" rx="2" fill="#10B981" />
        </g>
      </g>

      <!-- Order Book (Right) -->
      <g transform="translate(700, 0)">
        <rect width="360" height="350" rx="14" fill="url(#tradeCard)" stroke="#23324E" stroke-width="1" />
        <text x="20" y="28" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700">Live Wholesale Order Book</text>

        <!-- Asks (Sellers) -->
        <g transform="translate(20, 50)">
          <text x="0" y="0" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="600">PRICE (BDT)</text>
          <text x="140" y="0" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="600">AMOUNT (TON)</text>
          <text x="280" y="0" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="end">TOTAL</text>

          <g transform="translate(0, 16)">
            <text x="0" y="16" fill="#F87171" font-family="monospace" font-size="11">৳ 83.20</text>
            <text x="140" y="16" fill="#E2E8F0" font-family="monospace" font-size="11">45.0 T</text>
            <text x="280" y="16" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="end">৳ 37.4L</text>
          </g>

          <g transform="translate(0, 42)">
            <text x="0" y="16" fill="#F87171" font-family="monospace" font-size="11">৳ 82.90</text>
            <text x="140" y="16" fill="#E2E8F0" font-family="monospace" font-size="11">120.0 T</text>
            <text x="280" y="16" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="end">৳ 99.4L</text>
          </g>

          <!-- Spread -->
          <g transform="translate(0, 75)">
            <rect width="280" height="26" rx="6" fill="#0E1E2C" />
            <text x="140" y="17" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Spread: ৳ 0.40 (Tight Liquidity)</text>
          </g>

          <!-- Bids (Buyers) -->
          <g transform="translate(0, 115)">
            <text x="0" y="16" fill="#34D399" font-family="monospace" font-size="11">৳ 82.50</text>
            <text x="140" y="16" fill="#E2E8F0" font-family="monospace" font-size="11">80.0 T</text>
            <text x="280" y="16" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="end">৳ 66.0L</text>
          </g>

          <g transform="translate(0, 140)">
            <text x="0" y="16" fill="#34D399" font-family="monospace" font-size="11">৳ 82.20</text>
            <text x="140" y="16" fill="#E2E8F0" font-family="monospace" font-size="11">250.0 T</text>
            <text x="280" y="16" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="end">৳ 2.05Cr</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
