<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="ecom-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120614"/>
      <stop offset="50%" stop-color="#1A0B26"/>
      <stop offset="100%" stop-color="#08020C"/>
    </linearGradient>
    <linearGradient id="ecom-rose-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="ecom-orb-1" cx="20%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ecom-orb-2" cx="80%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="ecom-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#ecom-bg)"/>
  <rect width="1200" height="675" fill="url(#ecom-orb-1)"/>
  <rect width="1200" height="675" fill="url(#ecom-orb-2)"/>

  <!-- Top Bar -->
  <rect x="50" y="40" width="1100" height="60" rx="16" fill="#201230" fill-opacity="0.9" stroke="#4C1D95" stroke-width="1.5"/>
  <circle cx="80" cy="70" r="6" fill="#EF4444"/>
  <circle cx="100" cy="70" r="6" fill="#F59E0B"/>
  <circle cx="120" cy="70" r="6" fill="#10B981"/>
  
  <text x="160" y="75" fill="#FDF4FF" font-family="system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1">LUMINA // NEXT-GEN HEADLESS E-COMMERCE</text>
  
  <rect x="860" y="55" width="135" height="30" rx="8" fill="#F43F5E" fill-opacity="0.15" stroke="#F43F5E" stroke-width="1"/>
  <text x="927" y="75" fill="#FB7185" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">★ FLASH SALE 40%</text>
  
  <rect x="1005" y="55" width="125" height="30" rx="8" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="1"/>
  <text x="1067" y="75" fill="#C084FC" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">CART: 3 ITEMS</text>

  <!-- Left: Curated Product Grid & Flash Deal Hero -->
  <g transform="translate(50, 120)">
    <rect width="680" height="495" rx="20" fill="#170A24" fill-opacity="0.9" stroke="#3B1C54" stroke-width="1.5"/>
    
    <text x="30" y="45" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Trending Modern Goods &amp; Hardware</text>
    <text x="30" y="68" fill="#D8B4FE" font-family="system-ui, sans-serif" font-size="12">Headless Vue 3 + Laravel REST API Architecture</text>

    <!-- Product Card 1 -->
    <g transform="translate(30, 95)">
      <rect width="195" height="235" rx="14" fill="#241338" stroke="#4C1D95" stroke-width="1"/>
      <rect x="12" y="12" width="171" height="110" rx="10" fill="#12061C"/>
      <circle cx="97" cy="67" r="32" fill="#F43F5E" fill-opacity="0.2" filter="url(#ecom-glow)"/>
      <polygon points="97,45 125,85 69,85" fill="#FB7185"/>

      <text x="16" y="145" fill="#FFFFFF" font-size="13" font-weight="700">Wireless Noise Studio</text>
      <text x="16" y="165" fill="#D8B4FE" font-size="11">Hi-Res ANC Bluetooth 5.4</text>
      <text x="16" y="195" fill="#F43F5E" font-size="16" font-weight="800">$299.00</text>
      <text x="90" y="195" fill="#94A3B8" font-size="12" text-decoration="line-through">$399</text>

      <!-- Add to cart -->
      <rect x="16" y="202" width="163" height="24" rx="6" fill="#8B5CF6"/>
      <text x="97" y="218" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">+ Add to Cart</text>
    </g>

    <!-- Product Card 2 -->
    <g transform="translate(240, 95)">
      <rect width="195" height="235" rx="14" fill="#241338" stroke="#F43F5E" stroke-width="1.5"/>
      <rect x="12" y="12" width="171" height="110" rx="10" fill="#12061C"/>
      <circle cx="97" cy="67" r="32" fill="#8B5CF6" fill-opacity="0.2" filter="url(#ecom-glow)"/>
      <rect x="75" y="45" width="45" height="45" rx="8" fill="#C084FC"/>

      <text x="16" y="145" fill="#FFFFFF" font-size="13" font-weight="700">Mechanical Apex Board</text>
      <text x="16" y="165" fill="#D8B4FE" font-size="11">Gateron Brown Switches</text>
      <text x="16" y="195" fill="#F43F5E" font-size="16" font-weight="800">$189.00</text>

      <rect x="16" y="202" width="163" height="24" rx="6" fill="url(#ecom-rose-purple)"/>
      <text x="97" y="218" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">★ Hot Item</text>
    </g>

    <!-- Product Card 3 -->
    <g transform="translate(450, 95)">
      <rect width="200" height="235" rx="14" fill="#241338" stroke="#4C1D95" stroke-width="1"/>
      <rect x="12" y="12" width="176" height="110" rx="10" fill="#12061C"/>
      <circle cx="100" cy="67" r="32" fill="#10B981" fill-opacity="0.2"/>
      <circle cx="100" cy="67" r="22" fill="#34D399"/>

      <text x="16" y="145" fill="#FFFFFF" font-size="13" font-weight="700">4K Precision Camera</text>
      <text x="16" y="165" fill="#D8B4FE" font-size="11">HDR 60FPS Streaming</text>
      <text x="16" y="195" fill="#F43F5E" font-size="16" font-weight="800">$149.00</text>

      <rect x="16" y="202" width="168" height="24" rx="6" fill="#8B5CF6"/>
      <text x="100" y="218" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">+ Add to Cart</text>
    </g>

    <!-- Customer Reviews & Social Proof Banner -->
    <g transform="translate(30, 350)">
      <rect width="620" height="115" rx="14" fill="#0C0412" stroke="#3B1C54" stroke-width="1"/>
      
      <text x="25" y="35" fill="#FFFFFF" font-size="14" font-weight="700">Verified Customer Sentiment</text>
      <text x="25" y="55" fill="#F59E0B" font-size="14">★★★★★</text>
      <text x="110" y="55" fill="#D8B4FE" font-size="12 font-weight="600">4.92 / 5.0 (2,400+ reviews)</text>

      <text x="25" y="88" fill="#E2E8F0" font-size="12" font-style="italic">"Lightning fast checkout experience with instantaneous order tracking notifications."</text>
    </g>
  </g>

  <!-- Right: Shopping Cart Drawer & Instant Checkout -->
  <g transform="translate(755, 120)">
    <rect width="395" height="495" rx="20" fill="#170A24" fill-opacity="0.9" stroke="#3B1C54" stroke-width="1.5"/>
    
    <text x="25" y="45" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Instant Cart Drawer</text>
    <text x="25" y="68" fill="#D8B4FE" font-family="system-ui, sans-serif" font-size="12">1-Click Express Checkout</text>

    <!-- Cart Item 1 -->
    <g transform="translate(25, 95)">
      <rect width="345" height="65" rx="12" fill="#241338" stroke="#4C1D95" stroke-width="1"/>
      <rect x="10" y="10" width="45" height="45" rx="8" fill="#12061C"/>
      <text x="68" y="28" fill="#FFFFFF" font-size="13" font-weight="700">Wireless Noise Studio</text>
      <text x="68" y="46" fill="#A78BFA" font-size="11">Qty: 1 · Midnight Black</text>
      <text x="325" y="38" fill="#FB7185" font-size="14" font-weight="800" text-anchor="end">$299.00</text>
    </g>

    <!-- Cart Item 2 -->
    <g transform="translate(25, 170)">
      <rect width="345" height="65" rx="12" fill="#241338" stroke="#4C1D95" stroke-width="1"/>
      <rect x="10" y="10" width="45" height="45" rx="8" fill="#12061C"/>
      <text x="68" y="28" fill="#FFFFFF" font-size="13" font-weight="700">Mechanical Apex Board</text>
      <text x="68" y="46" fill="#A78BFA" font-size="11">Qty: 1 · RGB Hot-swap</text>
      <text x="325" y="38" fill="#FB7185" font-size="14" font-weight="800" text-anchor="end">$189.00</text>
    </g>

    <!-- Cart Summary Box -->
    <g transform="translate(25, 255)">
      <rect width="345" height="210" rx="14" fill="#0C0412" stroke="#3B1C54" stroke-width="1"/>
      
      <text x="20" y="32" fill="#D8B4FE" font-size="12">Subtotal:</text>
      <text x="325" y="32" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="end">$488.00</text>

      <text x="20" y="58" fill="#D8B4FE" font-size="12">Express Shipping:</text>
      <text x="325" y="58" fill="#10B981" font-size="13" font-weight="700" text-anchor="end">FREE</text>

      <text x="20" y="84" fill="#D8B4FE" font-size="12">Promo Code (PRO40):</text>
      <text x="325" y="84" fill="#F43F5E" font-size="13" font-weight="700" text-anchor="end">-$40.00</text>

      <line x1="20" y1="102" x2="325" y2="102" stroke="#3B1C54" stroke-width="1"/>

      <text x="20" y="130" fill="#FFFFFF" font-size="15" font-weight="800">Total Due:</text>
      <text x="325" y="130" fill="#FB7185" font-size="22" font-weight="800" text-anchor="end">$448.00</text>

      <!-- Pay Button -->
      <rect x="20" y="150" width="305" height="44" rx="12" fill="url(#ecom-rose-purple)" filter="url(#ecom-glow)"/>
      <text x="172" y="177" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">PAY WITH APPLE PAY / CARD</text>
    </g>
  </g>
</svg>
