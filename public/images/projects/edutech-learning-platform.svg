<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="edu-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07101E"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="edu-indigo-sky" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="edu-orb-1" cx="20%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="edu-orb-2" cx="80%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="edu-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#edu-bg)"/>
  <rect width="1200" height="675" fill="url(#edu-orb-1)"/>
  <rect width="1200" height="675" fill="url(#edu-orb-2)"/>

  <!-- Top Glass Bar -->
  <rect x="50" y="40" width="1100" height="60" rx="16" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
  <circle cx="80" cy="70" r="6" fill="#EF4444"/>
  <circle cx="100" cy="70" r="6" fill="#F59E0B"/>
  <circle cx="120" cy="70" r="6" fill="#10B981"/>
  
  <text x="160" y="75" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1">EDUSUITE // CAMPUS ERP &amp; LEARNING MANAGEMENT</text>
  
  <rect x="870" y="55" width="130" height="30" rx="8" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1"/>
  <text x="935" y="75" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">● 2,450 STUDENTS</text>
  
  <rect x="1015" y="55" width="115" height="30" rx="8" fill="#F97316" fill-opacity="0.15" stroke="#F97316" stroke-width="1"/>
  <text x="1072" y="75" fill="#FB923C" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">SEMESTER FALL</text>

  <!-- Left: Classroom Live Stream & Course Matrix -->
  <g transform="translate(50, 120)">
    <rect width="680" height="495" rx="20" fill="#0F172A" fill-opacity="0.85" stroke="#334155" stroke-width="1.5"/>
    
    <text x="30" y="45" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Live Virtual Classroom &amp; Interactive Board</text>
    <text x="30" y="68" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Advanced Algorithms &amp; Data Structures — Section B</text>

    <!-- Simulated Video Classroom Player -->
    <g transform="translate(30, 95)">
      <rect width="620" height="230" rx="14" fill="#020617" stroke="#1E293B" stroke-width="1"/>
      
      <!-- Video Screen Elements -->
      <path d="M 200 60 L 420 60 L 420 180 L 200 180 Z" fill="#1E293B" fill-opacity="0.5"/>
      <circle cx="310" cy="115" r="28" fill="#6366F1" fill-opacity="0.9" filter="url(#edu-glow)"/>
      <polygon points="305,103 323,115 305,127" fill="#FFFFFF"/>

      <rect x="20" y="20" width="80" height="24" rx="6" fill="#EF4444" fill-opacity="0.9"/>
      <text x="60" y="36" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">● LIVE 1080p</text>

      <rect x="110" y="20" width="110" height="24" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="165" y="36" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">142 Attendees</text>

      <!-- Bottom Player Controls -->
      <rect x="20" y="195" width="580" height="4" rx="2" fill="#334155"/>
      <rect x="20" y="195" width="360" height="4" rx="2" fill="#38BDF8"/>
      <circle cx="380" cy="197" r="6" fill="#38BDF8"/>
      <text x="20" y="218" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">42:15 / 1:30:00 — Chapter 4: Binary Search Trees</text>
    </g>

    <!-- Lower Course Modules Row -->
    <g transform="translate(30, 345)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="195" height="120" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="15" y="25" fill="#38BDF8" font-size="11" font-weight="700">MODULE 01</text>
      <text x="15" y="48" fill="#FFFFFF" font-size="13" font-weight="600">Database Normalization</text>
      <rect x="15" y="80" width="165" height="6" rx="3" fill="#0F172A"/>
      <rect x="15" y="80" width="165" height="6" rx="3" fill="#10B981"/>
      <text x="15" y="105" fill="#10B981" font-size="10" font-weight="600">100% Completed</text>

      <!-- Card 2 -->
      <rect x="210" y="0" width="195" height="120" rx="12" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
      <text x="225" y="25" fill="#A5B4FC" font-size="11" font-weight="700">MODULE 02</text>
      <text x="225" y="48" fill="#FFFFFF" font-size="13" font-weight="600">Concurrency &amp; Locks</text>
      <rect x="225" y="80" width="165" height="6" rx="3" fill="#0F172A"/>
      <rect x="225" y="80" width="115" height="6" rx="3" fill="#6366F1"/>
      <text x="225" y="105" fill="#C7D2FE" font-size="10" font-weight="600">70% In Progress</text>

      <!-- Card 3 -->
      <rect x="420" y="0" width="200" height="120" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="435" y="25" fill="#F97316" font-size="11" font-weight="700">MODULE 03</text>
      <text x="435" y="48" fill="#FFFFFF" font-size="13" font-weight="600">REST API Security</text>
      <rect x="435" y="80" width="170" height="6" rx="3" fill="#0F172A"/>
      <rect x="435" y="80" width="25" height="6" rx="3" fill="#F97316"/>
      <text x="435" y="105" fill="#FDBA74" font-size="10" font-weight="600">Upcoming Test</text>
    </g>
  </g>

  <!-- Right: Student Performance Radar & Attendance Metrics -->
  <g transform="translate(755, 120)">
    <rect width="395" height="495" rx="20" fill="#0F172A" fill-opacity="0.85" stroke="#334155" stroke-width="1.5"/>
    
    <text x="25" y="45" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Academic Analytics</text>
    <text x="25" y="68" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Exam scores, assignments &amp; attendance</text>

    <!-- Attendance Gauge Card -->
    <g transform="translate(25, 95)">
      <rect width="345" height="135" rx="14" fill="#020617" stroke="#1E293B" stroke-width="1"/>
      
      <!-- Circular Progress Ring -->
      <circle cx="75" cy="67" r="42" fill="none" stroke="#1E293B" stroke-width="8"/>
      <circle cx="75" cy="67" r="42" fill="none" stroke="url(#edu-indigo-sky)" stroke-width="8" stroke-dasharray="264" stroke-dashoffset="30" stroke-linecap="round"/>
      <text x="75" y="73" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">98%</text>

      <text x="140" y="48" fill="#94A3B8" font-size="11" font-weight="600">OVERALL ATTENDANCE</text>
      <text x="140" y="75" fill="#38BDF8" font-size="20" font-weight="800">49 / 50 Days</text>
      <text x="140" y="98" fill="#10B981" font-size="11" font-weight="600">● Top 5% in cohort</text>
    </g>

    <!-- Recent Grades & Submissions -->
    <g transform="translate(25, 245)">
      <text x="0" y="20" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Recent Exam Results</text>

      <!-- Grade 1 -->
      <g transform="translate(0, 35)">
        <rect width="345" height="58" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <circle cx="30" cy="29" r="16" fill="#10B981" fill-opacity="0.15"/>
        <text x="30" y="35" fill="#34D399" font-size="13" font-weight="800" text-anchor="middle">A+</text>
        <text x="58" y="26" fill="#FFFFFF" font-size="13" font-weight="600">Database Systems Midterm</text>
        <text x="58" y="44" fill="#94A3B8" font-size="10">Score: 96/100 · Verified by Instructor</text>
      </g>

      <!-- Grade 2 -->
      <g transform="translate(0, 105)">
        <rect width="345" height="58" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <circle cx="30" cy="29" r="16" fill="#6366F1" fill-opacity="0.15"/>
        <text x="30" y="35" fill="#818CF8" font-size="13" font-weight="800" text-anchor="middle">A</text>
        <text x="58" y="26" fill="#FFFFFF" font-size="13" font-weight="600">Algorithms &amp; Complexity</text>
        <text x="58" y="44" fill="#94A3B8" font-size="10">Score: 92/100 · Project Defense</text>
      </g>

      <!-- Grade 3 -->
      <g transform="translate(0, 175)">
        <rect width="345" height="58" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <circle cx="30" cy="29" r="16" fill="#F97316" fill-opacity="0.15"/>
        <text x="30" y="35" fill="#FB923C" font-size="13" font-weight="800" text-anchor="middle">A-</text>
        <text x="58" y="26" fill="#FFFFFF" font-size="13" font-weight="600">Software Testing &amp; QA</text>
        <text x="58" y="44" fill="#94A3B8" font-size="10">Score: 89/100 · Automated Test Suite</text>
      </g>
    </g>
  </g>
</svg>
